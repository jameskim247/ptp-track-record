name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Hash verification requires the committed bytes, including .gitattributes.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/verify.py
      - run: python3 -m unittest discover -s tests -v
