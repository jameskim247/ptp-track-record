name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Hourly after the publication SLA.  This is the only check that runs when
    # the publishing host is asleep, so it must not depend on a push happening.
    # Off the hour to reduce GitHub's scheduled-run delay.
    - cron: '17 14-20 * * *'
permissions:
  contents: read
env:
  # Hash verification requires the committed bytes, including .gitattributes.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/verify.py
  freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: freshness
        # Explicit bash adds pipefail. The default `bash -e` returned tee's status,
        # so a failed verification never failed this step.
        shell: bash
        run: |
          python3 scripts/verify.py --require-current \
            --timezone America/Chicago --not-before 08:30 | tee freshness.json
      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let errors;
            try {
              errors = JSON.parse(fs.readFileSync('freshness.json', 'utf8')).errors;
            } catch (error) {
              errors = ['verifier output unreadable: ' + error.message];
            }
            if (!Array.isArray(errors) || !errors.length) {
              errors = ['verification failed without reported errors'];
            }
            // Only a stale display date is a freshness diagnosis; anything else is integrity.
            const integrity = errors.filter(e => !String(e).startsWith('stale display-through date'));
            const label = integrity.length ? 'integrity-failure' : 'stale-record';
            const title = integrity.length ? 'Track record integrity check failed' : 'Track record is stale';
            const body = [
              'Scheduled verification failed at ' + new Date().toISOString() + '.',
              '',
              integrity.length
                ? 'The published package failed integrity verification. This is not a freshness diagnosis.'
                : 'The published record has not advanced past its publication SLA.',
              '',
              ...errors.map(e => '- ' + e),
              '',
              'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label,
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label],
              });
            }
