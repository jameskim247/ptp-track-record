name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Hourly after the publication SLA.  This is the only check that runs when
    # the publishing host is asleep, so it must not depend on a push happening.
    # Off the hour to reduce GitHub's scheduled-run delay.
    - cron: '17 14-20 * * *'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/verify.py
  freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: freshness
        run: |
          python3 scripts/verify.py | tee freshness.json
      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Track record verification failed';
            const body = [
              'Scheduled integrity verification failed at ' + new Date().toISOString() + '.',
              '',
              'The published package no longer matches its frozen proof manifest.',
              'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'verification-failed',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['verification-failed'],
              });
            }
