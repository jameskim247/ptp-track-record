name: daily publication
on:
  schedule:
    - cron: '17 14,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: series-2-publication
  cancel-in-progress: false
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test publication consumer
        run: python3 -m unittest discover -s tests -v
      - name: Verify current record
        run: python3 scripts/verify.py
      - name: Authenticate read-only public-artifact reader
        if: vars.SERIES2_GCS_URI != ''
        uses: google-github-actions/auth@v3
        with:
          project_id: currentiq
          workload_identity_provider: ${{ vars.SERIES2_WIF_PROVIDER }}
          service_account: ${{ vars.SERIES2_READER_SERVICE_ACCOUNT }}
      - name: Prepare Google Cloud CLI
        if: vars.SERIES2_GCS_URI != ''
        uses: google-github-actions/setup-gcloud@v3
      - name: Verify private evidence is inaccessible
        if: vars.SERIES2_GCS_URI != ''
        run: |
          if gcloud storage objects describe 'gs://currentiq-ptp-paper-evidence/series-2/private/seeds/ad4c6e416c2f7d10b13227d03cbb8d5f697ddd33d72e75f094ba6fbdb5e62595.npz' > "$RUNNER_TEMP/private-probe.out" 2> "$RUNNER_TEMP/private-probe.err"; then
            echo '::error::Public reader unexpectedly has private evidence access.'
            exit 1
          fi
          python3 -c 'import os,pathlib; error=pathlib.Path(os.environ["RUNNER_TEMP"],"private-probe.err").read_text(); assert "403" in error or "storage.objects.get" in error, "Private probe did not fail with the expected permission denial"'
      - name: Download public result artifact
        if: vars.SERIES2_GCS_URI != ''
        env:
          SERIES2_GCS_URI: ${{ vars.SERIES2_GCS_URI }}
        run: gcloud storage cp "$SERIES2_GCS_URI" "$RUNNER_TEMP/series2.zip" --quiet
      - name: Consume results and publish coverage receipt
        env:
          SERIES2_SOURCE_URL: ${{ vars.SERIES2_SOURCE_URL }}
          SERIES2_GCS_URI: ${{ vars.SERIES2_GCS_URI }}
        run: |
          if [ -n "$SERIES2_GCS_URI" ]; then
            python3 scripts/publish_daily.py --package "$RUNNER_TEMP/series2.zip"
          else
            python3 scripts/publish_daily.py
          fi
      - name: Commit verified results and coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/series-2/daily.csv data/series-2/weekly.csv data/series-2/monthly.csv data/series-2/summary.csv proof/anchor.json proof/records.sha256 proof/publication.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Series-2 daily coverage and verified results'
            git push origin HEAD:main
          fi
      - name: Independently verify published origin
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 scripts/verify.py
      - name: Require current generated results
        run: python3 scripts/publish_daily.py --check-freshness
